apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: doc-personal-preview
spec:
  title: 'doc personal preview'
  url: ''
  gitRepo: 'https://github.com/bytefolk/doc'
  author: 'ByteFolk'
  description: 'Private GitHub-only doc web and realtime collaboration preview for PeterGuy326.'
  readme: ''
  icon: ''
  templateType: inline
  locale: en
  categories: []
  defaults:
    app_name:
      type: string
      value: doc-peterguy326-f5396ac8
    app_host:
      type: string
      value: doc-peterguy326-f5396ac8
    collaboration_host:
      type: string
      value: doc-collab-peterguy326-f5396ac8
  inputs:
    web_image:
      description: 'Pinned linux/amd64 web image built with the final public HTTPS/WSS URLs'
      type: string
      default: 'DOC_WEB_IMAGE'
      required: true
    collaboration_image:
      description: 'Pinned linux/amd64 collaboration image'
      type: string
      default: 'DOC_COLLABORATION_IMAGE'
      required: true
    runtime_secret:
      description: 'Existing Secret with DATABASE_URL, OAuth and shared collaboration keys'
      type: string
      default: 'doc-preview-secrets'
      required: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: ${{ inputs.web_image }}
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/deploy-on-sealos: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ${{ defaults.app_name }}
          image: ${{ inputs.web_image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: DOC_PERSONAL_PREVIEW
              value: '1'
            - name: AUTH_GITHUB_ALLOWED_IDS
              value: '47820304'
            - name: AUTH_URL
              value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: NEXTAUTH_URL
              value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: NEXT_PUBLIC_APP_URL
              value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: NEXT_PUBLIC_COLLABORATE_EDIT_URL
              value: wss://${{ defaults.collaboration_host }}.${{ SEALOS_CLOUD_DOMAIN }}/collaborate
            - name: COLLABORATE_EDIT_HTTP_URL
              value: http://${{ defaults.app_name }}-collaboration.${{ SEALOS_NAMESPACE }}.svc.cluster.local:1234
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: '${{ inputs.runtime_secret }}', key: DATABASE_URL } }
            - name: AUTH_SECRET
              valueFrom: { secretKeyRef: { name: '${{ inputs.runtime_secret }}', key: AUTH_SECRET } }
            - name: AUTH_GITHUB_ID
              valueFrom: { secretKeyRef: { name: '${{ inputs.runtime_secret }}', key: AUTH_GITHUB_ID } }
            - name: AUTH_GITHUB_SECRET
              valueFrom: { secretKeyRef: { name: '${{ inputs.runtime_secret }}', key: AUTH_GITHUB_SECRET } }
            - name: COLLABORATE_API_AUTH_KEY
              valueFrom: { secretKeyRef: { name: '${{ inputs.runtime_secret }}', key: COLLABORATE_API_AUTH_KEY } }
            - name: COLLABORATE_INTERNAL_API_KEY
              valueFrom: { secretKeyRef: { name: '${{ inputs.runtime_secret }}', key: COLLABORATE_INTERNAL_API_KEY } }
          startupProbe:
            httpGet: { path: /api/health, port: 3000 }
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
          livenessProbe:
            tcpSocket: { port: 3000 }
          resources:
            requests: { cpu: 100m, memory: 102Mi }
            limits: { cpu: '1', memory: 1024Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/deploy-on-sealos: ${{ defaults.app_name }}
spec:
  selector:
    app: ${{ defaults.app_name }}
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
    cloud.sealos.io/deploy-on-sealos: ${{ defaults.app_name }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/enable-access-log: 'false'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: ${{ defaults.app_name }}
                port: { number: 3000 }
  tls:
    - hosts: ['${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}']
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}-collaboration
  annotations:
    originImageName: ${{ inputs.collaboration_image }}
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}-collaboration
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-collaboration
    cloud.sealos.io/deploy-on-sealos: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-collaboration
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-collaboration
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ${{ defaults.app_name }}-collaboration
          image: ${{ inputs.collaboration_image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 1234
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: '1234'
            - name: DOC_WEB_INTERNAL_URL
              value: http://${{ defaults.app_name }}.${{ SEALOS_NAMESPACE }}.svc.cluster.local:3000
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: '${{ inputs.runtime_secret }}', key: DATABASE_URL } }
            - name: API_AUTH_KEY
              valueFrom: { secretKeyRef: { name: '${{ inputs.runtime_secret }}', key: COLLABORATE_API_AUTH_KEY } }
            - name: INTERNAL_API_KEY
              valueFrom: { secretKeyRef: { name: '${{ inputs.runtime_secret }}', key: COLLABORATE_INTERNAL_API_KEY } }
            - name: COLLABORATE_INTERNAL_API_KEY
              valueFrom: { secretKeyRef: { name: '${{ inputs.runtime_secret }}', key: COLLABORATE_INTERNAL_API_KEY } }
          startupProbe:
            httpGet: { path: /ready, port: 1234 }
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /ready, port: 1234 }
          livenessProbe:
            tcpSocket: { port: 1234 }
          resources:
            requests: { cpu: 50m, memory: 51Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-collaboration
  labels:
    app: ${{ defaults.app_name }}-collaboration
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-collaboration
    cloud.sealos.io/deploy-on-sealos: ${{ defaults.app_name }}
spec:
  selector:
    app: ${{ defaults.app_name }}-collaboration
  ports:
    - port: 1234
      targetPort: 1234
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}-collaboration
  labels:
    app: ${{ defaults.app_name }}-collaboration
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-collaboration
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.collaboration_host }}
    cloud.sealos.io/deploy-on-sealos: ${{ defaults.app_name }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/enable-access-log: 'false'
    nginx.ingress.kubernetes.io/backend-protocol: WS
    nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
spec:
  rules:
    - host: ${{ defaults.collaboration_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: ${{ defaults.app_name }}-collaboration
                port: { number: 1234 }
  tls:
    - hosts: ['${{ defaults.collaboration_host }}.${{ SEALOS_CLOUD_DOMAIN }}']
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}
---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/deploy-on-sealos: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: ''
  name: 'doc personal preview'
  type: link
